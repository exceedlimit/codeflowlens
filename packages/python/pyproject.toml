[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowlens"
version = "0.1.0"
description = "바이브코딩으로 만든 시스템의 실행 흐름·메서드·엔티티를 시각화하는 모니터링 패키지 (Python 추적기 + 정적 분석기)"
requires-python = ">=3.9"
readme = "README.md"
dependencies = []

[project.scripts]
flowlens = "flowlens.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "fastapi>=0.100",
    "httpx>=0.24",
    "uvicorn>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
