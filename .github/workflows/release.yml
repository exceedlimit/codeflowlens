# 개요: 자동 배포 — vX.Y.Z 태그를 푸시하면 PyPI(codeflowlens)와 npm(@codeflowlens/node, @codeflowlens/ui)에
#       세 패키지를 함께 배포하고 GitHub Release를 만든다.
# 로직: 태그와 패키지 버전 일치 확인 → 전체 테스트(ci.yml) → PyPI·npm 배포(Trusted Publishing) → Release 생성.
# 참고: 토큰을 저장하지 않는다. PyPI/npm 사이트에 이 저장소의 release.yml을 "신뢰하는 배포자"로
#       등록해 두면 GitHub이 발급하는 일회용 인증(OIDC)으로 배포한다. 같은 버전이 이미 올라가 있으면
#       건너뛰므로, 일부만 실패했을 때 워크플로를 다시 실행해도 안전하다.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    name: 태그·버전 일치 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/version.mjs check "$GITHUB_REF_NAME"

  test:
    name: 전체 테스트
    needs: check-version
    uses: ./.github/workflows/ci.yml

  pypi:
    name: PyPI 배포
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/codeflowlens/
    permissions:
      contents: read
      id-token: write   # Trusted Publishing(OIDC) 인증에 필요
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build packages/python --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  npm:
    name: npm 배포 (@codeflowlens/${{ matrix.package }})
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@codeflowlens/${{ matrix.package }}
    permissions:
      contents: read
      id-token: write   # Trusted Publishing(OIDC) 인증에 필요
    strategy:
      fail-fast: false
      matrix:
        package: [node, ui]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm 최신화 (Trusted Publishing은 npm 11.5.1 이상 필요)
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - name: 배포 (이미 올라간 버전이면 건너뜀)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION 은 이미 배포돼 있어 건너뜁니다."
            exit 0
          fi
          npm publish

  github-release:
    name: GitHub Release 생성
    needs: [pypi, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Release 만들기 (변경 내역 자동 작성)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 이 이미 있습니다."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
